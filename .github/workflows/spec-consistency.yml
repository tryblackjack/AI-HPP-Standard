name: Spec Consistency Checker

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java for bounded formal verification
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run markdownlint
        run: |
          npx markdownlint-cli@0.42.0 --ignore "archive/**" "**/*.md" || {
            echo "::error::Markdown style issues detected"
            exit 1
          }

      - name: Check for broken internal links
        run: python3 scripts/check_links.py

      - name: Validate autonomous discovery profile
        run: python3 scripts/check_discovery_profile.py

      - name: Validate replication and persistence profile
        run: |
          python3 -m pip install -r requirements-ci.txt
          python3 scripts/check_replication_profile.py

      - name: Validate PAF register
        run: python3 scripts/check_paf_register.py

      - name: Validate formal core invariants
        run: |
          npx -y @informalsystems/quint@0.33.0 typecheck formal/ai_hpp_core.qnt
          npx -y @informalsystems/quint@0.33.0 test formal/ai_hpp_core.qnt --max-samples=1 --backend=typescript
          npx -y @informalsystems/quint@0.33.0 run formal/ai_hpp_core.qnt --invariant=allCoreInvariants --max-samples=5000 --max-steps=12 --backend=typescript
          npx -y @informalsystems/quint@0.33.0 verify formal/ai_hpp_core.qnt --invariant=allCoreInvariants --max-steps=12

      - name: Run PAF validator negative tests
        run: PYTHONPATH=. pytest tests

name: AI-HPP Standard Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install linters
        run: |
          pip install -r requirements-ci.txt

      - name: Check REUSE licensing metadata
        run: |
          python3 -m pip install reuse
          reuse lint

      - name: Lint Python scripts
        run: |
          if [ -d "scripts" ]; then
            ruff check scripts || {
              echo "::error::Python lint errors detected"
              exit 1
            }
          fi

      - name: Lint JS examples
        shell: bash
        run: |
          mapfile -d '' js_files < <(
            find examples/node -type f \
              \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0
          )
          if (( ${#js_files[@]} )); then
            npx eslint@9.13.0 "${js_files[@]}" || {
              echo "::error::JS lint errors detected"
              exit 1
            }
          else
            echo "No JavaScript example files found; nothing to lint."
          fi

      - name: Validate PAF register
        run: python3 scripts/check_paf_register.py

      - name: Validate autonomous discovery profile
        run: python3 scripts/check_discovery_profile.py

      - name: Validate implementation adoption assets
        run: python3 scripts/check_implementation_assets.py

      - name: Validate replication and persistence profile
        run: python3 scripts/check_replication_profile.py

      - name: Validate cyber-capable model containment profile
        run: python3 scripts/check_cyber_containment_profile.py

      - name: Validate subject-integrity and value-framing profile
        run: python3 scripts/check_subject_integrity_profile.py

      - name: Validate cross-cutting assurance protocol
        run: python3 scripts/check_assurance_protocol.py

      - name: Execute consequential advice and supervision fixtures
        run: python3 scripts/check_consequential_advice.py

      - name: Execute cyber-operation authority fixtures and mutants
        run: python3 scripts/check_cyber_authority.py

      - name: Execute oversight boundary fixtures and mutants
        run: python3 scripts/check_oversight_boundary.py

      - name: Run PAF validator negative tests
        # Includes executed disclosure mutants and positive access controls.
        run: PYTHONPATH=. pytest tests

      - name: Validate generated artifact disclosure profile
        run: python3 scripts/check_artifact_disclosure_profile.py

      - name: Validate proportionate action contract synchronization
        run: python3 scripts/check_proportionate_action_profile.py

      - name: Validate robot action binding contract synchronization
        run: python3 scripts/check_robot_action_binding_profile.py

      - name: Validate evidence grounding and oversight synchronization
        run: python3 scripts/check_evidence_grounding_oversight_profile.py

      - name: Validate consolidated release and formal coverage
        run: |
          if git diff --quiet HEAD^ HEAD -- data/releases/v4.4.0-rc.1.json; then
            python3 scripts/check_release.py
          else
            python3 scripts/check_release.py --frozen
          fi

      - name: Run AI-HPP safety audit
        run: |
          echo "Running safety rules audit…"

          violations=0

          # Forbidden words (anti-doom)
          forbidden=("raw_device_access" "direct_hardware_bridge" "unsafe_signal" "bypass_safety")

          for w in "${forbidden[@]}"; do
            if matches=$(git grep -n -I -e "$w" -- 'spec/*.md'); then
              printf '%s\n' "$matches"
              echo "::error::Forbidden term detected in active spec: $w"
              violations=1
            fi
          done

          if [ $violations -eq 1 ]; then
            exit 1
          fi

          echo "AI-HPP safety audit OK."

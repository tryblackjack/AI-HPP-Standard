name: Auto-Archive Repository Clutter (AI-HPP v4.3 Rules)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run auto-archive script
        run: |
          ALLOWED=(
            "README.md"
            "LICENSE"
            "LICENSES"
            "REUSE.toml"
            "TRADEMARKS.md"
            "LICENSING_PROVENANCE_MATRIX.csv"
            ".gitignore"
            "docs"
            "formal"
            "spec"
            "examples"
            "scripts"
            "tests"
            "data"
            "schemas"
            "archive"
            "CONTRIBUTING.md"
            "CITATION.cff"
            ".markdownlint.json"
            "eslint.config.mjs"
            "requirements-ci.txt"
          )

          mkdir -p archive/$(date +%Y-%m-%d)/auto

          # Convert allowed list into grep pattern
          PATTERN=$(printf "%s\n" "${ALLOWED[@]}" | paste -sd "|" -)

          for ITEM in * .*; do
            # Skip git internals and dots
            [[ "$ITEM" == "." || "$ITEM" == ".." || "$ITEM" == ".git" || "$ITEM" == ".github" ]] && continue

            if ! echo "$ITEM" | grep -Eq "^($PATTERN)$"; then
              TARGET="archive/$(date +%Y-%m-%d)/auto/$ITEM"
              echo "Archiving unexpected item: $ITEM → $TARGET"

              mkdir -p "$(dirname "$TARGET")"
              mv "$ITEM" "$TARGET"

              echo "Archived automatically by workflow #4: not part of v4.2 canonical layout." \
                > "${TARGET}.reason"
            fi
          done

      - name: Commit & Push
        run: |
          git config user.name "AI-HPP Auto-Archiver"
          git config user.email "actions@github.com"

          if [[ -n $(git status --porcelain) ]]; then
              git add -A
              git commit -m "auto-archive: cleanup based on AI-HPP v4.3 layout"
              git push
          else
              echo "No changes detected."
          fi
